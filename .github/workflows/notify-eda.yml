---
name: Build, Test & Deploy via EDA

on:
  push:
    branches:
      - main
    paths:
      - '*.py'
      - 'requirements.txt'
      - 'templates/**'
      - 'static/**'
      - 'tests/**'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Package application
        run: |
          BUILD_TIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          echo "BUILD_TIME=${BUILD_TIME}" >> $GITHUB_ENV
          echo "${BUILD_TIME}" > BUILD_TIME
          echo "${{ github.sha }}" > COMMIT_SHA

          tar czf webapp-${{ github.sha }}.tar.gz \
            app.py \
            wsgi.py \
            config.py \
            requirements.txt \
            templates/ \
            static/ \
            BUILD_TIME \
            COMMIT_SHA

          echo "Packaged webapp-${{ github.sha }}.tar.gz"
          ls -lh webapp-${{ github.sha }}.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-${{ github.sha }}
          path: webapp-${{ github.sha }}.tar.gz
          retention-days: 5

  notify-eda:
    name: Notify EDA Controller
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Send event to EDA Controller
        env:
          EDA_WEBHOOK_URL: ${{ secrets.EDA_WEBHOOK_URL }}
          EDA_WEBHOOK_USER: ${{ secrets.EDA_WEBHOOK_USER }}
          EDA_WEBHOOK_PASSWORD: ${{ secrets.EDA_WEBHOOK_PASSWORD }}
        run: |
          echo "Build passed. Sending webhook to EDA Controller..."
          echo "Commit: ${{ github.sha }}"
          echo "Repo:   ${{ github.repository }}"

          HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" \
            -X POST "${EDA_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -u "${EDA_WEBHOOK_USER}:${EDA_WEBHOOK_PASSWORD}" \
            -d '{
              "repo": "${{ github.repository }}",
              "commit_sha": "${{ github.sha }}",
              "committer": "${{ github.actor }}",
              "ref": "${{ github.ref }}",
              "message": "App updated",
              "build_status": "success"
            }')

          echo "EDA Controller responded with HTTP ${HTTP_CODE}"

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::EDA Controller returned HTTP ${HTTP_CODE}"
            exit 1
          fi

          echo "Webhook delivered successfully. Deployment will proceed via EDA."
