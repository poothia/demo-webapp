---
name: Notify EDA on Push

on:
  push:
    branches:
      - main

jobs:
  notify-eda:
    name: Notify EDA Controller
    runs-on: ubuntu-latest

    steps:
      - name: Send event to EDA Controller
        env:
          EDA_WEBHOOK_URL: ${{ secrets.EDA_WEBHOOK_URL }}
          EDA_WEBHOOK_USER: ${{ secrets.EDA_WEBHOOK_USER }}
          EDA_WEBHOOK_PASSWORD: ${{ secrets.EDA_WEBHOOK_PASSWORD }}
        run: |
          echo "New commit detected. Sending webhook to EDA Controller..."
          echo "Commit: ${{ github.sha }}"
          echo "Repo:   ${{ github.repository }}"

          HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" \
            -X POST "${EDA_WEBHOOK_URL}" \
            -H "Content-Type: application/json" \
            -u "${EDA_WEBHOOK_USER}:${EDA_WEBHOOK_PASSWORD}" \
            -d '{
              "repo": "${{ github.repository }}",
              "commit_sha": "${{ github.sha }}",
              "committer": "${{ github.actor }}",
              "ref": "${{ github.ref }}",
              "message": "App updated",
              "build_status": "success"
            }')

          echo "EDA Controller responded with HTTP ${HTTP_CODE}"

          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::EDA Controller returned HTTP ${HTTP_CODE}"
            exit 1
          fi

          echo "Webhook delivered successfully. Deployment will proceed via EDA."
